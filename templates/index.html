<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>title</title>
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
</head>
<body>
    <header>
        <div class="top-left">
            <div class="logo">
                <h1>InCell</h1>
            </div>
            <div class="stats">
                <h2>Stats:</h2>
            </div>
        </div>
        <div class="top">

        </div>
    </header>
    <main>
        <div class="menu">
            
        </div>
        <div class="content">
            {% for cell in cells %}
                <div class="box">
                    <img src="thumbnail/{{cell['hash']}}" alt="{{cell['extra']['filename']}}" width="{{cell['width']}}" height="{{cell['height']}}" loading="lazy">
                </div>
            {% endfor %}
        </div>
    </main>
</body>
</html>
